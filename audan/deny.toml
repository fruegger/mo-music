# cargo-deny configuration.
# Enforces Q1 (license cleanliness) and RISK-9 (dependency concentration) from
# audan-architecture-arc42.md S2.2. `cargo deny check licenses` is a hard stop
# in CI (S7.3), not a warning.

[graph]
targets = []
all-features = false
no-default-features = false

[licenses]
version = 2
# Accepted per S2.2. Anything else fails the build.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
# symphonia is MPL-2.0: file-level copyleft, accepted deliberately (S2.2, RISK-6).
name = "symphonia"
expression = "MPL-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Explicitly excluded per S2.2 -- never introduce, under any circumstances.
    { name = "essentia" },
    { name = "aubio" },
    { name = "madmom" },
    { name = "fftw" },
    { name = "rubberband" },
    { name = "qm-dsp" },
    { name = "chordino" },
    { name = "nnls-chroma" },
    { name = "tarsosdsp" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
yanked = "deny"