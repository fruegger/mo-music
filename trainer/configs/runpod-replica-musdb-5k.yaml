# The replica with 5,000 steps (20 x 250), constant lr 0.002: does longer training help or hurt?
# MUSDB18 is non-commercial.
task: separation
sources: configs/runpod-sources.log
out_dir: /workspace/runs/replica-musdb-5k

datasets:
  - {name: musdb18-prepared, train_split: train, val_split: test, weight: 1.0}   # MUSDB18 has no validation split

separation:
  source_set: musdb4
  n_fft: 2048
  hop: 1024
  base_channels: 12
  depth: 3
  source_weights: {vocals: 4.0}

mix:
  seconds: 3.0
  gain_db_range: [-12.0, 6.0]
  p_stem_dropped: 0.05   # vocals are rarely left out
  effects: true
  p_tempo: 0.0
  p_pitch: 0.0

train:
  epochs: 20
  steps_per_epoch: 250
  batch_size: 8
  lr: 0.002
  num_workers: 8   # runpod_setup.sh sets this from the CPUs it finds
  prefetch_factor: 1
  val_snippets: 48
  val_seed_base: 1000000
  seed: 0
