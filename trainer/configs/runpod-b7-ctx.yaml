# POD BATCH 7, arm family "ctx": the batch 6 "clean" recipe (n100-clean: Fit 8.8, Test 8.1) with ONE change: a bidirectional LSTM over the whole spectrum and snippet at the bottleneck (context: lstm, reduce 8, hidden 128). Question and decision rules: RUNPOD-BATCH7.md.
task: separation
sources: configs/runpod-sources-batch6.log   # replaced by the runner
out_dir: /workspace/runs/b6-ARM   # replaced by the runner

datasets:
  - {name: musdb18-prepared, train_split: train, val_split: test, weight: 1.0}   # train = the arm's n songs, test = the 50 real test songs

separation:
  mask: softmax
  source_set: musdb6
  n_fft: 2048
  hop: 1024
  base_channels: 12
  depth: 3
  tags: ../labels/musdb18-other-tags.csv   # relative to the trainer folder
  promote_single: true
  context: lstm
  context_reduce: 8
  context_hidden: 128

mix:
  seconds: 3.0
  gain_db_range: [0.0, 0.0]   # stems at their own level
  p_stem_dropped: 0.0
  effects: false
  p_tempo: 0.0
  p_pitch: 0.0

val_mix:
  effects: false
  p_tempo: 0.0
  p_pitch: 0.0

train:
  epochs: 20
  steps_per_epoch: 500   # 10,000 steps
  batch_size: 8
  lr: 0.002
  warmup_steps: 250
  lr_final_fraction: 0.05
  grad_clip: 1.0
  ema_decay: 0.999
  num_workers: 8   # runpod_setup.sh sets this to the pod's usable CPUs - 1
  prefetch_factor: 2
  val_snippets: 48
  val_seed_base: 1000000
  seed: 0
