sources: ../repo/prototype/sources.log
out_dir: runs/instrument-baseline

datasets:            # name as in sources.log, split
  - {name: slakh2100, train_split: train, val_split: validation}

mix:
  seconds: 8.0
  gain_db_range: [-12.0, 6.0]
  p_stem_dropped: 0.15
  effects: true
  # Rubber Band tempo/pitch at high quality costs ~1 s per stem (a snippet ~7 s on one core), so
  # apply it to a fraction of the snippets and use several dataloader workers.
  p_tempo: 0.3
  tempo_ratio_range: [0.85, 1.15]
  p_pitch: 0.3
  pitch_semitones_range: [-3.0, 3.0]
  pitch_drums: false

train:
  epochs: 20
  steps_per_epoch: 500
  batch_size: 16
  lr: 0.001
  num_workers: 4
  val_snippets: 200
  val_seed_base: 1000000
  seed: 0
