# A CPU-sized separation run (8 cores, no GPU): about 1500 steps of batch 8 in under an hour.
task: separation
sources: ../repo/prototype/sources.log
out_dir: runs/separation-cpu-1

datasets:
  - {name: slakh2100, train_split: train, val_split: validation}

separation:
  source_set: musdb4
  n_fft: 2048
  hop: 1024        # coarse time resolution: half the frames, about twice as fast as hop 512
  base_channels: 12
  depth: 3

mix:
  seconds: 3.0
  gain_db_range: [-12.0, 6.0]
  p_stem_dropped: 0.15
  effects: true
  p_tempo: 0.0     # Rubber Band costs ~1 s per stem: too slow for this budget
  p_pitch: 0.0

train:
  epochs: 10
  steps_per_epoch: 150
  batch_size: 8
  lr: 0.002
  num_workers: 2       # 3 workers plus a busy desktop ran the machine out of memory once
  prefetch_factor: 1
  val_snippets: 48
  val_seed_base: 1000000
  seed: 0
