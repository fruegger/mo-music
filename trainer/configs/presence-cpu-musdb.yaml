# Presence recogniser: which of drums / bass / vocals / other are audible in a 3 s mono mix (a source counts as
# present when its target is above -50 dB, like the evaluator and the gating oracle). Trained on MUSDB18 train with
# cross-song remixing and 30 % stem dropout so absent sources are common (labels roughly balanced), effects on,
# no tempo/pitch (slow, and recognition does not need it). Validated on MUSDB18 test, clean mixes, same dropout.
# The result feeds `trainer.separate --recogniser`. Anything trained on MUSDB18 is non-commercial.
task: presence
sources: ../repo/prototype/sources.log
out_dir: runs/presence-cpu-musdb-seed0

datasets:
  - name: musdb18-prepared
    train_split: train
    val_split: test   # MUSDB18 has no validation split
    weight: 1.0
    remix: {p: 0.5}

presence:
  source_set: musdb4
  active_db: -50.0
  n_mels: 96

mix:
  seconds: 3.0
  gain_db_range: [-12.0, 6.0]
  p_stem_dropped: 0.3   # many absent sources, in training and in validation
  effects: true
  p_tempo: 0.0
  p_pitch: 0.0

val_mix:
  effects: false   # score on clean mixes

train:
  epochs: 20
  steps_per_epoch: 150
  batch_size: 16
  lr: 0.001
  warmup_steps: 150
  lr_final_fraction: 0.05
  grad_clip: 1.0
  num_workers: 4
  prefetch_factor: 1
  val_snippets: 200
  ema_decay: 0.999
  val_seed_base: 1000000
  seed: 0
