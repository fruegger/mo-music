# POD BATCH 6, arm family "aug": "clean" plus the batch recipe's augmentation (effects, stem gains -12..+6 dB, 5% dropped stems), equal source weights
# MUSDB18 only (no studio songs), six sources, softmax masks, D's network (base_channels 12, depth 3), 10,000 steps. The runner (scripts/runpod_batch6.sh)
# writes the real config of an arm from this file: `sources` (the arm's song subset) and `out_dir` are replaced. Question and decision rules: RUNPOD-BATCH6.md.
task: separation
sources: configs/runpod-sources-batch6.log   # replaced by the runner
out_dir: /workspace/runs/b6-ARM   # replaced by the runner

datasets:
  - {name: musdb18-prepared, train_split: train, val_split: test, weight: 1.0}   # train = the arm's n songs, test = the 50 real test songs

separation:
  mask: softmax
  source_set: musdb6
  n_fft: 2048
  hop: 1024
  base_channels: 12
  depth: 3
  tags: ../labels/musdb18-other-tags.csv   # relative to the trainer folder
  promote_single: true

mix:
  seconds: 3.0
  gain_db_range: [-12.0, 6.0]
  p_stem_dropped: 0.05
  effects: true
  p_tempo: 0.0   # off on the pod: tempo/pitch rendering is ~20x slower per item
  p_pitch: 0.0

val_mix:
  effects: false
  p_tempo: 0.0
  p_pitch: 0.0

train:
  epochs: 20
  steps_per_epoch: 500   # 10,000 steps
  batch_size: 8
  lr: 0.002
  warmup_steps: 250
  lr_final_fraction: 0.05
  grad_clip: 1.0
  ema_decay: 0.999
  num_workers: 8   # runpod_setup.sh sets this to the pod's usable CPUs - 1
  prefetch_factor: 2
  val_snippets: 48
  val_seed_base: 1000000
  seed: 0
