# POD BATCH 5, arm I: batch 2's control D (six sources, hand tags + promotion, keys x4, swapped studio split, no Slakh) with `base_channels` 32, depth 3 (1.9 M parameters instead of 0.27 M).
# Data is read from a local copy on the pod (configs/runpod-sources-batch5.log). Question and decision rules: RUNPOD-BATCH5.md.
task: separation
sources: configs/runpod-sources-batch5.log
out_dir: /workspace/runs/b5-i-wide

datasets:
  - {name: musdb18-prepared, train_split: train, val_split: test, weight: 1.0}   # MUSDB18 has no validation split
  - {name: studio, train_split: train, val_split: test, weight: 0.25}   # about a fifth of the training items

separation:
  mask: softmax
  source_set: musdb6
  n_fft: 2048
  hop: 1024
  base_channels: 32
  depth: 3
  source_weights: {vocals: 4.0}
  tags: ../labels/musdb18-other-tags.csv   # relative to the trainer folder
  promote_single: true
  present_weights: {keys: 4.0}

mix:
  seconds: 3.0
  gain_db_range: [-12.0, 6.0]
  p_stem_dropped: 0.05   # vocals are rarely left out
  effects: true
  p_tempo: 0.0   # off on the pod: tempo/pitch rendering is ~20x slower per item and makes the run data-bound
  p_pitch: 0.0

val_mix:
  effects: false   # train with effects, tempo and pitch changes; score on clean mixes (what real recordings are)
  p_tempo: 0.0
  p_pitch: 0.0

train:
  epochs: 20
  steps_per_epoch: 500   # 10,000 steps
  batch_size: 8
  lr: 0.002
  warmup_steps: 250
  lr_final_fraction: 0.05
  grad_clip: 1.0
  ema_decay: 0.999
  num_workers: 8   # runpod_setup.sh sets this to the pod's usable CPUs - 1
  prefetch_factor: 2
  val_snippets: 48
  val_seed_base: 1000000
  seed: 0
