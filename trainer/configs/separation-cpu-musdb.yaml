# separation-cpu.yaml's model and budget, trained on Slakh2100 and MUSDB18 together (half of the
# batches each). Needs MUSDB18 prepared: `mixer prepare-musdb --src ... --dst C:/workarea/MUSDB18_prepared`.
# Anything trained on MUSDB18 is non-commercial.
task: separation
sources: ../repo/prototype/sources.log
out_dir: runs/separation-cpu-musdb-1

datasets:
  - {name: slakh2100, train_split: train, val_split: validation, weight: 1.0}
  - {name: musdb18-prepared, train_split: train, val_split: test, weight: 1.0}   # MUSDB18 has no validation split

separation:
  mask: sigmoid   # pinned: softmax became the default after this config was used
  source_set: musdb4
  n_fft: 2048
  hop: 1024
  base_channels: 12
  depth: 3

mix:
  seconds: 3.0
  gain_db_range: [-12.0, 6.0]
  p_stem_dropped: 0.15
  effects: true
  p_tempo: 0.0     # Rubber Band costs ~1 s per stem: too slow for this budget
  p_pitch: 0.0

train:
  epochs: 8
  steps_per_epoch: 150
  batch_size: 8
  lr: 0.002
  num_workers: 2       # 3 workers plus a busy desktop ran the machine out of memory twice
  prefetch_factor: 1
  val_snippets: 48
  val_seed_base: 1000000
  seed: 0
