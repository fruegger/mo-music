# Screening: separation-cpu-musdb-soft-aug-drop.yaml (30 % stem dropout) plus a loss that counts a source whose target is
# silent 10 times as much (separation.silent_weight). The dropout run alone left the leakage into absent sources at
# -17.9 dB (soft-aug: -17.6); a leak is a tiny absolute error for a plain L1 loss. Everything else is identical, so any
# change in the leakage (scripts/gating_experiment.py, condition `none`, dropout 0.4) comes from the weight.
# Non-commercial (MUSDB18).
task: separation
sources: ../repo/prototype/sources.log
out_dir: runs/local-soft-aug-silent-seed0

datasets:
  - {name: musdb18-prepared, train_split: train, val_split: test, weight: 1.0}   # MUSDB18 has no validation split

separation:
  mask: softmax
  source_set: musdb4
  n_fft: 2048
  hop: 1024
  base_channels: 12
  depth: 3
  source_weights: {vocals: 4.0}
  silent_weight: 10.0   # an error on a source whose target is silent counts 10 times

mix:
  seconds: 3.0
  gain_db_range: [-12.0, 6.0]
  p_stem_dropped: 0.3   # training: a source is often absent
  effects: true
  p_tempo: 0.5
  p_pitch: 0.5

val_mix:
  effects: false   # train with effects, tempo and pitch changes; score on clean mixes (what real recordings are)
  p_stem_dropped: 0.05   # validate on the natural distribution, like the earlier runs
  p_tempo: 0.0
  p_pitch: 0.0

train:
  epochs: 8
  steps_per_epoch: 150
  batch_size: 8
  lr: 0.002
  num_workers: 5   # tempo/pitch make the loader the bottleneck
  prefetch_factor: 1
  val_snippets: 48
  val_seed_base: 1000000
  seed: 0
